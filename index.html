<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Family Trip Coordinator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app" class="app-shell">
  <!-- All views are rendered here by js/app.js -->
  <div class="login-wrap">
    <div class="ticket">
      <div class="ticket-strip"><span>FAMILY TRIP · 2026</span><span>LOADING…</span></div>
      <div class="ticket-body">
        <h2>Family Trip Coordinator</h2>
        <p class="sub">Starting up…</p>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- Firebase (compat SDK — no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
